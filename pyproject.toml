[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpan115"
version = "0.2.0"
description = "Python SDK for Flowpan's external 115 storage gateway"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "yyllaa" },
]

[tool.setuptools]
package-dir = {"" = "sdk/python"}
py-modules = ["flowpan115"]
