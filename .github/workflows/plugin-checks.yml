name: Plugin source and SDK checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          for plugin in ed2k dian-openapi wopan music; do
            python tools/plugin_release.py check --plugin plugins/$plugin
          done
          python tools/plugin_release.py test-modules
          python -m unittest discover -s tools/tests -p test_plugin_release.py
